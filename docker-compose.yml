services:
  broker:
    build: .
    container_name: ai-syncforge-broker
    restart: always
    ports:
      - "${SYNCFORGE_PORT:-8000}:${SYNCFORGE_PORT:-8000}"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/task_queue.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /app/data/task_queue.db 'PRAGMA journal_mode;' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
